

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription | AMOK SARL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      color: #183153;
    }
    main {
      max-width: 480px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px #0001;
    }
    h1, h2 { text-align: center; }
    h1 { color: #123b65; }
    .slogan { text-align: center; color: #536579; }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      margin-top: 22px;
      border: none;
      background: #123b65;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .info { font-size: 14px; line-height: 1.5; }
    #message { margin-top: 15px; line-height: 1.5; }
    a { color: #123b65; }
  </style>
</head>
<body>
  <main>
    <h1>AMOK SARL</h1>
    <p class="slogan">
      Connecter les opportunités aux bonnes personnes.
    </p>
    <h2>Créer un compte</h2>

    <p class="info">
      Remplissez ce formulaire. Votre inscription restera
      en attente jusqu'à sa vérification par l'administration.
    </p>

    <form id="inscriptionForm">
      <label for="nom">Nom complet</label>
      <input id="nom" name="nom_complet"
             type="text" autocomplete="name" required>

      <label for="telephone">Téléphone</label>
      <input id="telephone" name="telephone"
             type="tel" autocomplete="tel"
             placeholder="Ex. : 80138000" required>

      <label for="type">Type de compte</label>
      <select id="type" name="type_compte" required>
        <option value="">Choisir un profil</option>
        <option value="Transporteur">Transporteur</option>
        <option value="Entreprise">Entreprise</option>
        <option value="Personnel">Personnel</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="domaine">Domaine d'activité</label>
      <select id="domaine" name="domaine" required>
        <option value="">Choisir un domaine</option>
        <option value="Logistique">Logistique</option>
        <option value="Transport">Transport</option>
        <option value="Vente et location de voitures">
          Vente et location de voitures
        </option>
      </select>

      <button type="submit">Envoyer mon inscription</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="info">
      <a href="index.html">Retour à l'accueil</a>
    </p>
  </main>

  <script>
    document.getElementById("inscriptionForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Le formulaire est prêt, mais la connexion sécurisée " +
          "à la base de données doit encore être configurée.";
      });
  </script>
</body>
</html>
